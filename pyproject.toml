[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-jd-matcher"
version = "2.0.0"
description = "Resume screening and job description matching capstone prototype"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24,<2",
  "scikit-learn==1.7.1",
  "joblib>=1.3",
  "fastapi>=0.141",
  "uvicorn>=0.27",
  "streamlit>=1.64",
  "torch==2.1.1",
  "transformers==4.40.2",
  "sentence-transformers==2.7.0",
]

[project.optional-dependencies]
research = [
  "datasets>=2.18",
  "matplotlib==3.9.4",
  "nbformat==5.10.4",
  "nbclient==0.10.2",
  "ipykernel==6.29.5",
  "pytest==8.3.5",
  "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["src"]
